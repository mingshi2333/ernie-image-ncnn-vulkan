[package]
name = "ernie-tokenizer-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde_json = "1"
serde = "=1.0.229"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
panic = "unwind"
