name: Native platform build

on:
  push:
    branches: [main, 'codex/surpass-reference']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        options: [all, linux, windows, macos]
        default: all

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.98.0'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        vulkan: ['OFF', 'ON']
        compact_reader: ['OFF']
        include:
          - vulkan: 'OFF'
            compact_reader: 'ON'
    steps:
      # https://github.com/actions/checkout (v7, verified 2026-09-05)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python3 -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libpng-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
      - name: Verify software Vulkan and the validation layer
        if: matrix.vulkan == 'ON'
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          test -r /usr/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json
          mkdir -p build
          vulkaninfo --summary > build/vulkan-validation-info.log 2>&1
          cat build/vulkan-validation-info.log
      - name: Configure pinned ncnn and native tokenizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DERNIE_ENABLE_VULKAN=${{ matrix.vulkan }}
          -DERNIE_TEST_VULKAN_VALIDATION=${{ matrix.vulkan }}
          -DERNIE_EXPERIMENT_COMPACT_MODEL_READER=${{ matrix.compact_reader }}
          -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON
          -DNCNN_SYSTEM_GLSLANG=OFF -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Model-free runtime and package contracts
        # Software Vulkan exercises the kernels; this is not a hardware or
        # real-weight image quality benchmark. CTest reports unavailable GPUs.
        run: ctest --test-dir build --output-on-failure --output-junit "$PWD/build/ctest-results.xml"
      - name: Check validation output including skipped tests
        if: matrix.vulkan == 'ON'
        run: python3 cmake/check_vulkan_validation.py build/Testing/Temporary/LastTest.log
      - name: Install and check executable
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/ernie-install"
          "$RUNNER_TEMP/ernie-install/bin/ernie-image" --help
      - name: Save configure and test records
        if: always()
        # actions/upload-artifact v7, verified 2026-09-08.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-vulkan-${{ matrix.vulkan }}-reader-${{ matrix.compact_reader }}
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
            build/vulkan-validation-info.log
          retention-days: 14

  windows:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Configure MSVC and native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools are unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libpng:x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DERNIE_ENABLE_VULKAN=ON -DNCNN_SIMPLEVK=ON -DNCNN_SYSTEM_GLSLANG=OFF `
            -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON `
            -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Windows executable and SDK
        run: cmake --build build --parallel 2
      - name: Native CPU, CLI, package and installed-consumer tests
        # Vulkan is compiled. Device-dependent tests report skips when the
        # hosted Windows VM has no usable Vulkan driver.
        run: ctest --test-dir build --output-on-failure --output-junit "$env:GITHUB_WORKSPACE/build/ctest-results.xml"
      - name: Save configure and test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-msvc-vulkan
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
          retention-days: 14

  macos:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python3 -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Install native dependencies
        run: |
          brew install ninja libpng vulkan-loader molten-vk
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          # Apple Paravirtual crashes in the Metal placement-heap texture path.
          # Exercise ordinary Metal allocation on this VM; no kernels are skipped.
          echo "MVK_CONFIG_USE_MTLHEAP=0" >> "$GITHUB_ENV"
          rustc --version
          clang++ --version
      - name: Configure Apple Clang and native tokenizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DERNIE_ENABLE_VULKAN=ON -DNCNN_SIMPLEVK=OFF -DNCNN_SYSTEM_GLSLANG=OFF
          -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON
          -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
      - name: Build native macOS executable and SDK
        run: cmake --build build --parallel 2
      - name: Native CPU, CLI, package and installed-consumer tests
        id: contracts
        # MoltenVK device availability is recorded by the tests. A skipped
        # device test is not counted as GPU execution evidence.
        run: ctest --test-dir build --output-on-failure --output-junit "$PWD/build/ctest-results.xml"
      - name: Record macOS Vulkan crash details
        if: ${{ failure() && steps.contracts.outcome == 'failure' }}
        run: |
          if test -x build/ernie-gelu-probe; then
            lldb --batch -o run -k 'thread backtrace all' -- build/ernie-gelu-probe vulkan fp32 > build/vulkan-backtrace.log 2>&1 || true
            cat build/vulkan-backtrace.log
            otool -L build/ernie-gelu-probe > build/vulkan-libraries.log
          fi
      - name: Save configure and test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-apple-clang-vulkan
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
            build/vulkan-*.log
          retention-days: 14
