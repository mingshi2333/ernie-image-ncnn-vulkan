name: Native platform build

on:
  push:
    branches: [main, 'codex/surpass-reference']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate
        type: choice
        options: [all, linux, windows, macos]
        default: all

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  CARGO_BUILD_JOBS: '2'
  RUSTUP_TOOLCHAIN: '1.98.0'

concurrency:
  group: build-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  linux:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'linux' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        vulkan: ['OFF', 'ON']
        compact_reader: ['OFF']
        include:
          - vulkan: 'OFF'
            compact_reader: 'ON'
    steps:
      # https://github.com/actions/checkout (v7, verified 2026-09-05)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python3 -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libpng-dev libvulkan-dev mesa-vulkan-drivers libxcb1 libx11-6 libwayland-client0
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          rustup default 1.98.0
          rustc --version
      - name: Install pinned official Vulkan validation tools
        if: matrix.vulkan == 'ON'
        env:
          # LunarG Linux SDK and published SHA256, verified 2026-09-09:
          # https://vulkan.lunarg.com/sdk/files.json
          ERNIE_SDK_VERSION: '1.4.357.1'
          ERNIE_SDK_SHA256: '4b41e3b30e8aedaa5dac7c136561ab463eb316a25a54e2c6245f2c299ea1fb85'
        run: |
          sdk_archive="$RUNNER_TEMP/ernie-vulkansdk.tar.xz"
          sdk_root="$RUNNER_TEMP/ernie-vulkan-sdk"
          sdk_url="https://sdk.lunarg.com/sdk/download/$ERNIE_SDK_VERSION/linux/vulkansdk-linux-x86_64-$ERNIE_SDK_VERSION.tar.xz"
          mkdir -p "$sdk_root" build
          curl --fail --location --show-error --retry 3 "$sdk_url" -o "$sdk_archive"
          printf '%s  %s\n' "$ERNIE_SDK_SHA256" "$sdk_archive" | sha256sum --check | tee build/vulkan-sdk-sha256.log
          # Only the layer and diagnostic executable are needed. Keep the
          # distribution's Vulkan loader, Mesa driver and build tools intact.
          tar -xJf "$sdk_archive" -C "$sdk_root" \
            "$ERNIE_SDK_VERSION/x86_64/lib/libVkLayer_khronos_validation.so" \
            "$ERNIE_SDK_VERSION/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
            "$ERNIE_SDK_VERSION/x86_64/bin/vulkaninfo"
          sdk_runtime="$sdk_root/$ERNIE_SDK_VERSION/x86_64"
          printf 'ERNIE_VALIDATION_SDK=%s\n' "$sdk_runtime" >> "$GITHUB_ENV"
          printf 'VK_LAYER_PATH=%s/share/vulkan/explicit_layer.d\n' "$sdk_runtime" >> "$GITHUB_ENV"
          printf 'LD_LIBRARY_PATH=%s/lib%s\n' "$sdk_runtime" "${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$sdk_runtime" >> "$GITHUB_PATH"
          python3 - "$sdk_runtime" "$sdk_url" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          manifest = root / 'share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json'
          layer = json.loads(manifest.read_text())['layer']
          assert layer['name'] == 'VK_LAYER_KHRONOS_validation', layer
          assert layer['api_version'] == '1.4.357', layer
          library = (manifest.parent / layer['library_path']).resolve(strict=True)
          assert library == root / 'lib/libVkLayer_khronos_validation.so', library
          files = [manifest, library, root / 'bin/vulkaninfo']
          record = {'sdk_version': os.environ['ERNIE_SDK_VERSION'], 'url': sys.argv[2],
                    'archive_sha256': os.environ['ERNIE_SDK_SHA256'], 'layer_api_version': layer['api_version'],
                    'files': {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}
          pathlib.Path('build/vulkan-sdk-provenance.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, indent=2))
          PY
      - name: Verify software Vulkan and the validation layer
        if: matrix.vulkan == 'ON'
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          test "$(command -v vulkaninfo)" = "$ERNIE_VALIDATION_SDK/bin/vulkaninfo"
          vulkaninfo --summary > build/vulkan-validation-info.log 2>&1
          cat build/vulkan-validation-info.log
          python3 - <<'PY'
          import pathlib, re
          report = pathlib.Path('build/vulkan-validation-info.log').read_text()
          layers = [line for line in report.splitlines() if line.startswith('VK_LAYER_KHRONOS_validation ')]
          assert len(layers) == 1 and re.search(r'\s1\.4\.357\s+version\s+1\s*$', layers[0]), layers
          assert 'PHYSICAL_DEVICE_TYPE_CPU' in report and 'llvmpipe' in report, report
          print('Confirmed official validation layer 1.4.357 and Mesa llvmpipe')
          PY
          python3 cmake/check_vulkan_validation.py build/vulkan-validation-info.log
      - name: Configure pinned ncnn and native tokenizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DERNIE_ENABLE_VULKAN=${{ matrix.vulkan }}
          -DERNIE_TEST_VULKAN_VALIDATION=${{ matrix.vulkan }}
          -DERNIE_EXPERIMENT_COMPACT_MODEL_READER=${{ matrix.compact_reader }}
          -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON
          -DNCNN_SYSTEM_GLSLANG=OFF -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
      - name: Build
        run: cmake --build build --parallel 2
      - name: Model-free runtime and package contracts
        # Software Vulkan exercises the kernels; this is not a hardware or
        # real-weight image quality benchmark. CTest reports unavailable GPUs.
        run: ctest --test-dir build --output-on-failure --output-junit "$PWD/build/ctest-results.xml"
      - name: Check validation output including skipped tests
        if: matrix.vulkan == 'ON'
        run: python3 cmake/check_vulkan_validation.py build/Testing/Temporary/LastTest.log
      - name: Install and check executable
        run: |
          cmake --install build --prefix "$RUNNER_TEMP/ernie-install"
          "$RUNNER_TEMP/ernie-install/bin/ernie-image" --help
      - name: Save configure and test records
        if: always()
        # actions/upload-artifact v7, verified 2026-09-08.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-vulkan-${{ matrix.vulkan }}-reader-${{ matrix.compact_reader }}
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
            build/vulkan-validation-info.log
            build/vulkan-sdk-sha256.log
            build/vulkan-sdk-provenance.json
          retention-days: 14

  windows:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Configure MSVC and native dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'MSVC x64 tools are unavailable' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install libpng:x64-windows-static-md --clean-after-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md `
            -DERNIE_ENABLE_VULKAN=ON -DNCNN_SIMPLEVK=ON -DNCNN_SYSTEM_GLSLANG=OFF `
            -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON `
            -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build native Windows executable and SDK
        run: cmake --build build --parallel 2
      - name: Native CPU, CLI, package and installed-consumer tests
        # Vulkan is compiled. Device-dependent tests report skips when the
        # hosted Windows VM has no usable Vulkan driver.
        run: ctest --test-dir build --output-on-failure --output-junit "$env:GITHUB_WORKSPACE/build/ctest-results.xml"
      - name: Save configure and test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-msvc-vulkan
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
          retention-days: 14

  macos:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Model download contracts with local HTTP fixtures
        run: python3 -W error::ResourceWarning -m unittest tests.test_model_download tests.test_release_manifest -v
      - name: Install native dependencies
        run: |
          brew install ninja libpng vulkan-loader molten-vk
          rustup toolchain install 1.98.0 --profile minimal --no-self-update
          echo "VK_DRIVER_FILES=$(brew --prefix molten-vk)/etc/vulkan/icd.d/MoltenVK_icd.json" >> "$GITHUB_ENV"
          # Apple Paravirtual crashes in the Metal placement-heap texture path.
          # Exercise ordinary Metal allocation on this VM; no kernels are skipped.
          echo "MVK_CONFIG_USE_MTLHEAP=0" >> "$GITHUB_ENV"
          rustc --version
          clang++ --version
      - name: Configure Apple Clang and native tokenizer
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DERNIE_ENABLE_VULKAN=ON -DNCNN_SIMPLEVK=OFF -DNCNN_SYSTEM_GLSLANG=OFF
          -DERNIE_BUILD_TOKENIZER=ON -DERNIE_BUILD_GENERATOR=ON -DERNIE_INSTALL_SDK=ON
          -DNCNN_INT8=OFF -DNCNN_WEIGHT_QUANT=OFF
      - name: Build native macOS executable and SDK
        run: cmake --build build --parallel 2
      - name: Native CPU, CLI, package and installed-consumer tests
        id: contracts
        # MoltenVK device availability is recorded by the tests. A skipped
        # device test is not counted as GPU execution evidence.
        run: ctest --test-dir build --output-on-failure --output-junit "$PWD/build/ctest-results.xml"
      - name: Record macOS Vulkan crash details
        if: ${{ failure() && steps.contracts.outcome == 'failure' }}
        run: |
          if test -x build/ernie-gelu-probe; then
            lldb --batch -o run -k 'thread backtrace all' -- build/ernie-gelu-probe vulkan fp32 > build/vulkan-backtrace.log 2>&1 || true
            cat build/vulkan-backtrace.log
            otool -L build/ernie-gelu-probe > build/vulkan-libraries.log
          fi
      - name: Save configure and test records
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-apple-clang-vulkan
          path: |
            build/CMakeCache.txt
            build/ctest-results.xml
            build/Testing/Temporary/*.log
            build/vulkan-*.log
          retention-days: 14
